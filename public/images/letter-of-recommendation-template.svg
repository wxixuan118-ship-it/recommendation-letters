<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Letter of recommendation template preview">
  <rect width="640" height="360" fill="#f8fafc"/>
  <!-- Document paper -->
  <rect x="120" y="30" width="400" height="300" fill="#ffffff" stroke="#d9dee7" stroke-width="1" rx="4"/>
  <!-- Header lines -->
  <rect x="150" y="55" width="180" height="8" fill="#1f4e79" rx="2"/>
  <rect x="150" y="70" width="120" height="6" fill="#6b7280" rx="2"/>
  <rect x="150" y="82" width="140" height="5" fill="#9ca3af" rx="2"/>
  <!-- Divider -->
  <rect x="150" y="100" width="340" height="1" fill="#d9dee7"/>
  <!-- Salutation -->
  <rect x="150" y="115" width="100" height="7" fill="#374151" rx="2"/>
  <!-- Body paragraphs -->
  <rect x="150" y="135" width="340" height="5" fill="#4b5563" rx="2"/>
  <rect x="150" y="145" width="330" height="5" fill="#4b5563" rx="2"/>
  <rect x="150" y="155" width="310" height="5" fill="#4b5563" rx="2"/>
  <rect x="150" y="165" width="320" height="5" fill="#4b5563" rx="2"/>
  <rect x="150" y="175" width="300" height="5" fill="#4b5563" rx="2"/>

  <rect x="150" y="195" width="340" height="5" fill="#4b5563" rx="2"/>
  <rect x="150" y="205" width="335" height="5" fill="#4b5563" rx="2"/>
  <rect x="150" y="215" width="320" height="5" fill="#4b5563" rx="2"/>
  <rect x="150" y="225" width="310" height="5" fill="#4b5563" rx="2"/>
  <rect x="150" y="235" width="280" height="5" fill="#4b5563" rx="2"/>
  <!-- Signature area -->
  <rect x="350" y="265" width="120" height="1" fill="#374151"/>
  <rect x="350" y="275" width="80" height="6" fill="#374151" rx="2"/>
  <rect x="350" y="288" width="100" height="5" fill="#6b7280" rx="2"/>
  <!-- Label -->
  <text x="320" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Letter of Recommendation Template</text>
</svg>
